<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const repoBase = '/rudraconstructionspvtltd.com';
      const currentPath = window.location.pathname;

      if (currentPath === repoBase || currentPath === repoBase + '/') {
        window.location.replace(repoBase + '/');
      } else {
        const redirectPath = currentPath.startsWith(repoBase)
          ? currentPath.replace(repoBase, repoBase)
          : repoBase + currentPath;

        window.location.replace(redirectPath);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
