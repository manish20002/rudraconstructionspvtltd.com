<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const repoBase = '/rudraconstructionspvtltd.com';
      const currentPath = window.location.pathname;
      const routePath = currentPath.startsWith(repoBase)
        ? currentPath.slice(repoBase.length) || '/'
        : currentPath;

      if (routePath === '/' || routePath === '') {
        window.location.replace(repoBase + '/');
      } else {
        const redirect = encodeURIComponent(routePath);
        window.location.replace(repoBase + '/?redirect=' + redirect);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
